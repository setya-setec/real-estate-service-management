{% if is_paginated %}
<nav aria-label="{{ label|default:'Page navigation' }}" class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-3">
  <span class="text-secondary small">Showing page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }} &middot; {{ page_obj.paginator.count }} records</span>
  <ul class="pagination mb-0">
    {% if page_obj.has_previous %}<li class="page-item"><a class="page-link" href="?{{ filter_query }}&amp;page={{ page_obj.previous_page_number }}"><i class="bi bi-chevron-left"></i> Previous</a></li>{% endif %}
    <li class="page-item active"><span class="page-link" aria-current="page">{{ page_obj.number }}</span></li>
    {% if page_obj.has_next %}<li class="page-item"><a class="page-link" href="?{{ filter_query }}&amp;page={{ page_obj.next_page_number }}">Next <i class="bi bi-chevron-right"></i></a></li>{% endif %}
  </ul>
</nav>
{% endif %}
