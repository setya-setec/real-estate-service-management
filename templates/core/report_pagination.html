{% if pagination.is_paginated %}<nav aria-label="{{ pagination.anchor|title }} report pages" class="d-flex justify-content-between align-items-center flex-wrap gap-2 px-3 py-2 border-top">
<span class="text-secondary small">Page {{ pagination.page_obj.number }} of {{ pagination.page_obj.paginator.num_pages }}</span>
<ul class="pagination my-0">
{% if pagination.page_obj.has_previous %}<li class="page-item"><a class="page-link" href="?{{ pagination.filter_query }}&amp;{{ pagination.page_key }}={{ pagination.page_obj.previous_page_number }}#{{ pagination.anchor }}"><i class="bi bi-chevron-left"></i> Previous</a></li>{% endif %}
{% if pagination.page_obj.has_next %}<li class="page-item"><a class="page-link" href="?{{ pagination.filter_query }}&amp;{{ pagination.page_key }}={{ pagination.page_obj.next_page_number }}#{{ pagination.anchor }}">Next <i class="bi bi-chevron-right"></i></a></li>{% endif %}
</ul></nav>{% endif %}
